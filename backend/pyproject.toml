[project]
name = "mentorlens-backend"
version = "0.1.0"
description = "MentorLens — Agentic AI code-review mentor backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "arq>=0.25.0",
    "httpx>=0.27.0",
    "PyGithub>=2.2.0",
    "cryptography>=42.0.5",
    "pyjwt[crypto]>=2.8.0",
    "chromadb>=0.5.0",
    "langchain>=0.1.13",
    "langgraph>=0.0.30",
    "pylint>=3.1.0",
    "bandit>=1.7.8",
    "gitpython>=3.1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
